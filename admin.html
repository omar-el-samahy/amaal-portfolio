<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Amaal Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen">
    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-zinc-200">
            <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none" required>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-zinc-300 text-zinc-900 focus:ring-zinc-900">
                    <label for="remember-me" class="text-sm font-medium text-zinc-600">Remember me</label>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none" required>
                </div>
                <button type="submit" class="w-full py-3 bg-zinc-900 text-white rounded-xl font-bold hover:bg-zinc-800 transition-colors">Login</button>
            </form>
        </div>
    </div>

    <div id="admin-content" class="hidden p-8 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-3xl font-bold">Portfolio Manager</h1>
            <button id="logout-btn" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">Logout</button>
        </div>

        <div class="space-y-12">
            <!-- Site Settings Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Site Settings</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-200">
                            <label class="block text-sm font-medium mb-2">Logo Upload</label>
                            <div class="flex gap-2">
                                <input type="file" id="logo-file" class="text-xs w-full">
                                <button id="upload-logo" class="px-3 py-1 bg-zinc-900 text-white text-xs rounded-lg">Upload</button>
                            </div>
                            <input type="text" id="site-logo" placeholder="Logo URL" class="w-full p-3 mt-2 rounded-xl border border-zinc-300 text-xs focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-200">
                            <label class="block text-sm font-medium mb-2">Favicon Upload</label>
                            <div class="flex gap-2">
                                <input type="file" id="favicon-file" class="text-xs w-full">
                                <button id="upload-favicon" class="px-3 py-1 bg-zinc-900 text-white text-xs rounded-lg">Upload</button>
                            </div>
                            <input type="text" id="site-favicon" placeholder="Favicon URL" class="w-full p-3 mt-2 rounded-xl border border-zinc-300 text-xs focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Title (EN)</label>
                            <input type="text" id="hero-title-en" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Title (AR)</label>
                            <input type="text" id="hero-title-ar" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Subtitle (EN)</label>
                            <input type="text" id="hero-sub-en" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Subtitle (AR)</label>
                            <input type="text" id="hero-sub-ar" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Desc (EN)</label>
                            <textarea id="hero-desc-en" class="w-full p-3 rounded-xl border border-zinc-300 h-20 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Desc (AR)</label>
                            <textarea id="hero-desc-ar" class="w-full p-3 rounded-xl border border-zinc-300 h-20 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                    </div>
                </div>
                <button id="save-settings" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">Save Site Settings</button>
            </section>

            <!-- Profile & About Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Profile & About</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Bio (English)</label>
                            <textarea id="bio-en" class="w-full p-3 rounded-xl border border-zinc-300 h-32 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" id="email-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">WhatsApp</label>
                            <input type="text" id="whatsapp-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Bio (Arabic)</label>
                            <textarea id="bio-ar" class="w-full p-3 rounded-xl border border-zinc-300 h-32 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">LinkedIn</label>
                            <input type="text" id="linkedin-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Behance</label>
                            <input type="text" id="behance-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                </div>
                <button id="save-profile" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">Save Profile</button>
            </section>

            <!-- Projects Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Projects</h2>
                <div id="projects-list" class="space-y-4">
                    <!-- Project items will be loaded here -->
                </div>
                <button id="add-project" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">+ Add Project</button>
            </section>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="project-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
            <div class="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50">
                <h3 id="modal-title" class="text-xl font-bold">Add Project</h3>
                <button id="close-modal" class="text-zinc-400 hover:text-zinc-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-8 overflow-y-auto space-y-6">
                <!-- Image Upload Area -->
                <div class="p-4 bg-zinc-50 rounded-2xl border border-zinc-200 space-y-4">
                    <label class="block text-sm font-medium">Project Image</label>
                    <div class="flex gap-4 items-start">
                        <div class="w-24 h-24 rounded-xl bg-zinc-200 overflow-hidden border border-zinc-300 flex-shrink-0">
                            <img id="project-preview" src="https://via.placeholder.com/100" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 space-y-2">
                            <div class="flex gap-2">
                                <input type="file" id="project-file" class="text-xs w-full">
                                <button id="upload-project-img" class="px-3 py-1 bg-zinc-900 text-white text-xs rounded-lg">Upload</button>
                            </div>
                            <input type="text" id="project-image-url" placeholder="Or paste image URL" class="w-full p-2 rounded-lg border border-zinc-300 text-xs outline-none">
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- English Side -->
                    <div class="space-y-4">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">English Details</h4>
                        <div>
                            <label class="block text-sm font-medium mb-1">Title</label>
                            <input type="text" id="p-title-en" class="w-full p-3 rounded-xl border border-zinc-300 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Description</label>
                            <textarea id="p-desc-en" class="w-full p-3 rounded-xl border border-zinc-300 h-24 outline-none"></textarea>
                        </div>
                    </div>
                    <!-- Arabic Side -->
                    <div class="space-y-4 text-right" dir="rtl">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-zinc-400 mb-2">التفاصيل العربية</h4>
                        <div>
                            <label class="block text-sm font-medium mb-1">العنوان</label>
                            <input type="text" id="p-title-ar" class="w-full p-3 rounded-xl border border-zinc-300 outline-none text-right">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">الوصف</label>
                            <textarea id="p-desc-ar" class="w-full p-3 rounded-xl border border-zinc-300 h-24 outline-none text-right"></textarea>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Category</label>
                    <input type="text" id="p-category" placeholder="e.g. Brand Identity" class="w-full p-3 rounded-xl border border-zinc-300 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Order (Low = First)</label>
                        <input type="number" id="p-sort" placeholder="0" class="w-full p-3 rounded-xl border border-zinc-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Project Link</label>
                        <input type="text" id="p-link" placeholder="https://..." class="w-full p-3 rounded-xl border border-zinc-300 outline-none">
                    </div>
                </div>
            </div>
            </div>
            <div class="p-6 border-t border-zinc-100 bg-zinc-50 flex justify-end gap-3">
                <button id="close-modal-btn" class="px-6 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-200 rounded-lg transition-colors">Cancel</button>
                <button id="save-project" class="px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">Save Project</button>
            </div>
        </div>
    </div>


    <script>
        const SUPABASE_URL = 'https://muprfemezzdwbrqwlrcj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11cHJmZW1lenpkd2JycXdscmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzAxODAsImV4cCI6MjEwNTQwNjE4MH0.qhL0SWGnEpP6Ej0VZwFk9YdNrYxeNFxxwfTAosr7ZRI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const authContainer = document.getElementById('auth-container');
        const adminContent = document.getElementById('admin-content');
        const loginForm = document.getElementById('login-form');

        // Check for remembered session on load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                authContainer.classList.add('hidden');
                adminContent.classList.remove('hidden');
                loadAllData();
            }
        });

        // --- AUTH LOGIC ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-me').checked;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                // Supabase handles the session in localStorage automatically when signed in
                authContainer.classList.add('hidden');
                adminContent.classList.remove('hidden');
                loadAllData();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            location.reload();
        });

        // --- STORAGE HELPERS ---
        async function uploadFile(fileInputId, buttonId, folder = 'logos') {
            const fileInput = document.getElementById(fileInputId);
            const file = fileInput.files[0];
            if (!file) return alert('Please select a file first!');

            const fileName = `${Date.now()}_${file.name}`;
            const filePath = `${folder}/${fileName}`;

            const { data, error } = await _supabase.storage.from('assets').upload(filePath, file);

            if (error) {
                alert('Upload failed: ' + error.message);
                return null;
            }

            const { data: { publicUrl } } = _supabase.storage.from('assets').getPublicUrl(filePath);
            return publicUrl;
        }

        document.getElementById('upload-logo').addEventListener('click', async () => {
            const url = await uploadFile('logo-file', 'upload-logo', 'logos');
            if (url) {
                document.getElementById('site-logo').value = url;
                alert('Logo uploaded successfully!');
            }
        });

        document.getElementById('upload-favicon').addEventListener('click', async () => {
            const url = await uploadFile('favicon-file', 'upload-favicon', 'icons');
            if (url) {
                document.getElementById('site-favicon').value = url;
                alert('Favicon uploaded successfully!');
            }
        });

        // Project Specific Image Upload
        document.getElementById('upload-project-img').addEventListener('click', async () => {
            const url = await uploadFile('project-file', 'upload-project-img', 'projects');
            if (url) {
                document.getElementById('project-image-url').value = url;
                document.getElementById('project-preview').src = url;
                alert('Project image uploaded!');
            }
        });

        // Live preview for manual URL paste
        document.getElementById('project-image-url').addEventListener('input', (e) => {
            document.getElementById('project-preview').src = e.target.value || 'https://via.placeholder.com/100';
        });

        // --- DATA LOADING ---
        async function loadAllData() {
            await loadSettings();
            await loadProfile();
            await loadProjects();
        }

        async function loadSettings() {
            const { data, error } = await _supabase.from('site_settings').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('site-logo').value = data.logo_url || '';
                document.getElementById('site-favicon').value = data.favicon_url || '';
                document.getElementById('hero-title-en').value = data.hero_title_en || '';
                document.getElementById('hero-title-ar').value = data.hero_title_ar || '';
                document.getElementById('hero-sub-en').value = data.hero_sub_en || '';
                document.getElementById('hero-sub-ar').value = data.hero_sub_ar || '';
                document.getElementById('hero-desc-en').value = data.hero_desc_en || '';
                document.getElementById('hero-desc-ar').value = data.hero_desc_ar || '';
            }
        }

        async function loadProfile() {
            const { data, error } = await _supabase.from('profile').select('*').single();
            if (data) {
                document.getElementById('bio-en').value = data.bio_en || '';
                document.getElementById('bio-ar').value = data.bio_ar || '';
                document.getElementById('email-profile').value = data.email || '';
                document.getElementById('whatsapp-profile').value = data.whatsapp || '';
                document.getElementById('linkedin-profile').value = data.linkedin || '';
                document.getElementById('behance-profile').value = data.behance || '';
            }
        }

        async function loadProjects() {
            const { data, error } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('projects-list');
            list.innerHTML = '';

            if (data) {
                data.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-4 bg-zinc-50 rounded-2xl border border-zinc-200';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold">${p.title_en}</p>
                            <p class="text-xs text-zinc-500">${p.category || 'No Category'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editProject('${p.id}')" class="px-3 py-1 text-xs bg-white border border-zinc-300 rounded-lg hover:bg-zinc-100">Edit</button>
                            <button onclick="deleteProject('${p.id}')" class="px-3 py-1 text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100">Delete</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        // --- SAVING LOGIC ---
        document.getElementById('save-settings').addEventListener('click', async () => {
            const updates = {
                logo_url: document.getElementById('site-logo').value,
                favicon_url: document.getElementById('site-favicon').value,
                hero_title_en: document.getElementById('hero-title-en').value,
                hero_title_ar: document.getElementById('hero-title-ar').value,
                hero_sub_en: document.getElementById('hero-sub-en').value,
                hero_sub_ar: document.getElementById('hero-sub-ar').value,
                hero_desc_en: document.getElementById('hero-desc-en').value,
                hero_desc_ar: document.getElementById('hero-desc-ar').value,
                updated_at: new Date()
            };
            const { error } = await _supabase.from('site_settings').upsert({ id: 1, ...updates });
            if (error) alert('Error saving settings: ' + error.message); else alert('Settings saved!');
        });

        document.getElementById('save-profile').addEventListener('click', async () => {
            const updates = {
                bio_en: document.getElementById('bio-en').value,
                bio_ar: document.getElementById('bio-ar').value,
                email: document.getElementById('email-profile').value,
                whatsapp: document.getElementById('whatsapp-profile').value,
                linkedin: document.getElementById('linkedin-profile').value,
                behance: document.getElementById('behance-profile').value,
                updated_at: new Date()
            };

            // Using your specific Supabase User ID as the Profile ID
            const { error } = await _supabase.from('profile').upsert({ 
                id: '3e3d7cfe-59ee-4395-9502-c3543065a487', 
                ...updates 
            });

            if (error) alert('Error saving profile: ' + error.message); else alert('Profile saved!');
        });


        // --- PROJECT CRUD ---
        let currentProjectId = null;
        const projectModal = document.getElementById('project-modal');

        const openModal = (id = null) => {
            currentProjectId = id;
            document.getElementById('modal-title').innerText = id ? 'Edit Project' : 'Add Project';
            
            // Reset form
            document.getElementById('p-title-en').value = '';
            document.getElementById('p-title-ar').value = '';
            document.getElementById('p-desc-en').value = '';
            document.getElementById('p-desc-ar').value = '';
            document.getElementById('p-category').value = '';
            document.getElementById('p-link').value = '';
            document.getElementById('p-sort').value = '0';
            document.getElementById('project-image-url').value = '';
            document.getElementById('project-preview').src = 'https://via.placeholder.com/100';
            document.getElementById('project-file').value = '';

            if (id) {
                _supabase.from('projects').select('*').eq('id', id).single().then(({ data }) => {
                    if (data) {
                        document.getElementById('p-title-en').value = data.title_en;
                        document.getElementById('p-title-ar').value = data.title_ar;
                        document.getElementById('p-desc-en').value = data.description_en;
                        document.getElementById('p-desc-ar').value = data.description_ar;
                        document.getElementById('p-category').value = data.category;
                        document.getElementById('p-link').value = data.link_url;
                        document.getElementById('p-sort').value = data.sort_order || '0';
                        document.getElementById('project-image-url').value = data.image_url;
                        document.getElementById('project-preview').src = data.image_url;
                    }
                });
            }
            projectModal.classList.remove('hidden');
        };

        const closeModal = () => projectModal.classList.add('hidden');

        document.getElementById('add-project').addEventListener('click', () => openModal());
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('close-modal-btn').addEventListener('click', closeModal);

        document.getElementById('save-project').addEventListener('click', async () => {
            const projectData = {
                title_en: document.getElementById('p-title-en').value,
                title_ar: document.getElementById('p-title-ar').value,
                description_en: document.getElementById('p-desc-en').value,
                description_ar: document.getElementById('p-desc-ar').value,
                category: document.getElementById('p-category').value,
                link_url: document.getElementById('p-link').value,
                image_url: document.getElementById('project-image-url').value,
                sort_order: parseInt(document.getElementById('p-sort').value) || 0,
            };

            if (!projectData.title_en || !projectData.title_ar) return alert('Titles are required!');

            let error;
            if (currentProjectId) {
                const { error: upErr } = await _supabase.from('projects').update(projectData).eq('id', currentProjectId);
                error = upErr;
            } else {
                const { error: insErr } = await _supabase.from('projects').insert([projectData]);
                error = insErr;
            }

            if (error) alert('Error: ' + error.message); else {
                alert('Project saved!');
                closeModal();
                loadProjects();
            }
        });

        async function deleteProject(id) {
            if (!confirm('Delete this project?')) return;
            const { error } = await _supabase.from('projects').delete().eq('id', id);
            if (error) alert('Error: ' + error.message); else {
                alert('Deleted!');
                loadProjects();
            }
        }

        async function editProject(id) {
            openModal(id);
        }
    </script>
</body>
</html>
