<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Amaal Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen">
    <div id="auth-container" class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl border border-zinc-200">
            <h1 class="text-2xl font-bold mb-6 text-center">Admin Login</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none" required>
                </div>
                <button type="submit" class="w-full py-3 bg-zinc-900 text-white rounded-xl font-bold hover:bg-zinc-800 transition-colors">Login</button>
            </form>
        </div>
    </div>

    <div id="admin-content" class="hidden p-8 max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-12">
            <h1 class="text-3xl font-bold">Portfolio Manager</h1>
            <button id="logout-btn" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 rounded-lg transition-colors">Logout</button>
        </div>

        <div class="space-y-12">
            <!-- Site Settings Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Site Settings</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Logo URL</label>
                            <input type="text" id="site-logo" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Favicon URL</label>
                            <input type="text" id="site-favicon" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Title (EN)</label>
                            <input type="text" id="hero-title-en" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Title (AR)</label>
                            <input type="text" id="hero-title-ar" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Subtitle (EN)</label>
                            <input type="text" id="hero-sub-en" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Subtitle (AR)</label>
                            <input type="text" id="hero-sub-ar" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Desc (EN)</label>
                            <textarea id="hero-desc-en" class="w-full p-3 rounded-xl border border-zinc-300 h-20 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Hero Desc (AR)</label>
                            <textarea id="hero-desc-ar" class="w-full p-3 rounded-xl border border-zinc-300 h-20 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                    </div>
                </div>
                <button id="save-settings" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">Save Site Settings</button>
            </section>

            <!-- Profile & About Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Profile & About</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Bio (English)</label>
                            <textarea id="bio-en" class="w-full p-3 rounded-xl border border-zinc-300 h-32 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Email</label>
                            <input type="email" id="email-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">WhatsApp</label>
                            <input type="text" id="whatsapp-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Bio (Arabic)</label>
                            <textarea id="bio-ar" class="w-full p-3 rounded-xl border border-zinc-300 h-32 focus:ring-2 focus:ring-zinc-900 outline-none"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">LinkedIn</label>
                            <input type="text" id="linkedin-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Behance</label>
                            <input type="text" id="behance-profile" class="w-full p-3 rounded-xl border border-zinc-300 focus:ring-2 focus:ring-zinc-900 outline-none">
                        </div>
                    </div>
                </div>
                <button id="save-profile" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">Save Profile</button>
            </section>

            <!-- Projects Section -->
            <section class="bg-white p-8 rounded-3xl border border-zinc-200 shadow-sm">
                <h2 class="text-xl font-bold mb-6">Projects</h2>
                <div id="projects-list" class="space-y-4">
                    <!-- Project items will be loaded here -->
                </div>
                <button id="add-project" class="mt-6 px-6 py-2 bg-zinc-900 text-white rounded-lg font-medium hover:bg-zinc-800 transition-colors">+ Add Project</button>
            </section>
        </div>
    </div>


    <script>
        const SUPABASE_URL = 'https://muprfemezzdwbrqwlrcj.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11cHJmZW1lenpkd2JycXdscmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzAxODAsImV4cCI6MjEwNTQwNjE4MH0.qhL0SWGnEpP6Ej0VZwFk9YdNrYxeNFxxwfTAosr7ZRI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const authContainer = document.getElementById('auth-container');
        const adminContent = document.getElementById('admin-content');
        const loginForm = document.getElementById('login-form');

        // --- AUTH LOGIC ---
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                authContainer.classList.add('hidden');
                adminContent.classList.remove('hidden');
                loadAllData();
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await _supabase.auth.signOut();
            location.reload();
        });

        // --- DATA LOADING ---
        async function loadAllData() {
            await loadSettings();
            await loadProfile();
            await loadProjects();
        }

        async function loadSettings() {
            const { data, error } = await _supabase.from('site_settings').select('*').eq('id', 1).single();
            if (data) {
                document.getElementById('site-logo').value = data.logo_url || '';
                document.getElementById('site-favicon').value = data.favicon_url || '';
                document.getElementById('hero-title-en').value = data.hero_title_en || '';
                document.getElementById('hero-title-ar').value = data.hero_title_ar || '';
                document.getElementById('hero-sub-en').value = data.hero_sub_en || '';
                document.getElementById('hero-sub-ar').value = data.hero_sub_ar || '';
                document.getElementById('hero-desc-en').value = data.hero_desc_en || '';
                document.getElementById('hero-desc-ar').value = data.hero_desc_ar || '';
            }
        }

        async function loadProfile() {
            const { data, error } = await _supabase.from('profile').select('*').single();
            if (data) {
                document.getElementById('bio-en').value = data.bio_en || '';
                document.getElementById('bio-ar').value = data.bio_ar || '';
                document.getElementById('email-profile').value = data.email || '';
                document.getElementById('whatsapp-profile').value = data.whatsapp || '';
                document.getElementById('linkedin-profile').value = data.linkedin || '';
                document.getElementById('behance-profile').value = data.behance || '';
            }
        }

        async function loadProjects() {
            const { data, error } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('projects-list');
            list.innerHTML = '';

            if (data) {
                data.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-4 bg-zinc-50 rounded-2xl border border-zinc-200';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold">${p.title_en}</p>
                            <p class="text-xs text-zinc-500">${p.category || 'No Category'}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editProject('${p.id}')" class="px-3 py-1 text-xs bg-white border border-zinc-300 rounded-lg hover:bg-zinc-100">Edit</button>
                            <button onclick="deleteProject('${p.id}')" class="px-3 py-1 text-xs bg-red-50 text-red-600 border border-red-200 rounded-lg hover:bg-red-100">Delete</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        // --- SAVING LOGIC ---
        document.getElementById('save-settings').addEventListener('click', async () => {
            const updates = {
                logo_url: document.getElementById('site-logo').value,
                favicon_url: document.getElementById('site-favicon').value,
                hero_title_en: document.getElementById('hero-title-en').value,
                hero_title_ar: document.getElementById('hero-title-ar').value,
                hero_sub_en: document.getElementById('hero-sub-en').value,
                hero_sub_ar: document.getElementById('hero-sub-ar').value,
                hero_desc_en: document.getElementById('hero-desc-en').value,
                hero_desc_ar: document.getElementById('hero-desc-ar').value,
                updated_at: new Date()
            };
            const { error } = await _supabase.from('site_settings').upsert({ id: 1, ...updates });
            if (error) alert('Error saving settings: ' + error.message); else alert('Settings saved!');
        });

        document.getElementById('save-profile').addEventListener('click', async () => {
            const updates = {
                bio_en: document.getElementById('bio-en').value,
                bio_ar: document.getElementById('bio-ar').value,
                email: document.getElementById('email-profile').value,
                whatsapp: document.getElementById('whatsapp-profile').value,
                linkedin: document.getElementById('linkedin-profile').value,
                behance: document.getElementById('behance-profile').value,
                updated_at: new Date()
            };
            const { error } = await _supabase.from('profile').upsert({ id: 'default', ...updates });
            if (error) alert('Error saving profile: ' + error.message); else alert('Profile saved!');
        });

        // --- PROJECT CRUD ---
        document.getElementById('add-project').addEventListener('click', async () => {
            const title_en = prompt('Project Title (English):');
            const title_ar = prompt('Project Title (Arabic):');
            const category = prompt('Category:');
            const image_url = prompt('Image URL:');
            const link_url = prompt('Link URL:');
            const description_en = prompt('Description (English):');
            const description_ar = prompt('Description (Arabic):');

            if (!title_en || !title_ar) return alert('Titles are required!');

            const { error } = await _supabase.from('projects').insert([{
                title_en, title_ar, category, image_url, link_url, description_en, description_ar
            }]);

            if (error) alert('Error adding project: ' + error.message); else {
                alert('Project added!');
                loadProjects();
            }
        });

        async function deleteProject(id) {
            if (!confirm('Delete this project?')) return;
            const { error } = await _supabase.from('projects').delete().eq('id', id);
            if (error) alert('Error: ' + error.message); else {
                alert('Deleted!');
                loadProjects();
            }
        }

        async function editProject(id) {
            const { data: p } = await _supabase.from('projects').select('*').eq('id', id).single();
            const title_en = prompt('Project Title (English):', p.title_en);
            const title_ar = prompt('Project Title (Arabic):', p.title_ar);
            const category = prompt('Category:', p.category);
            const image_url = prompt('Image URL:', p.image_url);
            const link_url = prompt('Link URL:', p.link_url);
            const description_en = prompt('Description (English):', p.description_en);
            const description_ar = prompt('Description (Arabic):', p.description_ar);

            const { error } = await _supabase.from('projects').update({
                title_en, title_ar, category, image_url, link_url, description_en, description_ar
            }).eq('id', id);

            if (error) alert('Error: ' + error.message); else {
                alert('Updated!');
                loadProjects();
            }
        }
    </script>
</body>
</html>
